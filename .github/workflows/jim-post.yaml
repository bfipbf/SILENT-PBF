name: Jim POST - protected private request
on:
  workflow_dispatch:
    inputs:
      private_issue:
        description: 'Private Issue number containing ### Jim POST'
        required: true
        type: string
      request_id:
        description: 'Request ID matching the private manifest'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: jim-post-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  approved-post:
    if: >-
      contains(fromJSON('["jimmytobing","098595","bfipbf"]'), github.actor)
    environment: prod-write-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_ISSUE_NUMBER: ${{ inputs.private_issue }}
      REQUEST_ID: ${{ inputs.request_id }}
      PRIVATE_PBF_TOKEN: ${{ secrets.PRIVATE_PBF_TOKEN }}
      SF_CLIENT_ID: ${{ secrets.SF_BFI_PROD_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_BFI_PROD_CLIENT_SECRET }}
      SF_BFI_PROD_APIKEY: ${{ secrets.SF_BFI_PROD_APIKEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Approved private Jim POST request
        shell: bash
        run: node .github/mjs/jim-post-approved.mjs
