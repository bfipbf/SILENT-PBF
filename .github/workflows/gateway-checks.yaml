name: Gateway implementation checks
on:
  pull_request:
    paths:
      - '.github/mjs/mutation-preflight.mjs'
      - '.github/workflows/mutation-preflight.yaml'
      - '.github/workflows/gateway-checks.yaml'
      - '.github/workflows/jim.yaml'
      - '.github/mjs/jim-post-approved.mjs'
      - '.github/mjs/jim-post-issue-route.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node syntax checks
        run: |
          node --check .github/mjs/mutation-preflight.mjs
          node --check .github/mjs/sf-readonly.mjs
          node --check .github/mjs/jim-readonly.mjs
          node --check .github/mjs/private-evidence.mjs
          node --check .github/mjs/jim-post-approved.mjs
          node --check .github/mjs/jim-post-issue-route.mjs
      - name: Guard against accidental mutation commands
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'SF_CLIENT_SECRET|SF_BFI_PROD_APIKEY|sf[[:space:]]+project[[:space:]]+deploy|sf[[:space:]]+data[[:space:]]+(create|update|delete|upsert)' .github/workflows/mutation-preflight.yaml
          echo 'Preflight workflow carries no Salesforce mutation secrets or deploy command'

      - name: Test issue-based POST routing without PROD access
        shell: bash
        run: |
          set -euo pipefail
          event="$RUNNER_TEMP/jim-event.json"
          output="$RUNNER_TEMP/route-output"
          printf '%s' '{"sender":{"login":"bfipbf"},"issue":{"number":9999,"user":{"login":"bfipbf"},"body":"### Jim POST Request\n\n```json\n{\"privateIssue\":21,\"requestId\":\"PBF-20261118-TEST-0001\"}\n```"}}' > "$event"
          GITHUB_EVENT_PATH="$event" GITHUB_OUTPUT="$output" node .github/mjs/jim-post-issue-route.mjs
          grep -Fxq 'private_issue=21' "$output"
          grep -Fxq 'request_id=PBF-20261118-TEST-0001' "$output"
          printf '%s' '{"sender":{"login":"not-allowlisted"},"issue":{"number":9999,"user":{"login":"bfipbf"},"body":"### Jim POST Request"}}' > "$event"
          if GITHUB_EVENT_PATH="$event" GITHUB_OUTPUT="$output" node .github/mjs/jim-post-issue-route.mjs; then
            echo 'Security test failed: unauthorized actor accepted'
            exit 1
          fi
          echo 'PASS: valid references route, unauthorized actors fail'
