name: Temporary Jim private evidence smoke test
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/mjs/publish-jim-private.mjs'
      - '.github/workflows/jim.yaml'
      - '.github/workflows/private-evidence-smoke.yaml'
permissions:
  contents: read
jobs:
  private-evidence-test:
    if: github.event.pull_request.number == 23 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ISSUE_NUMBER: '24'
      PRIVATE_PBF_TOKEN: ${{ secrets.PRIVATE_PBF_TOKEN }}
      EVIDENCE_FILE: ${{ runner.temp }}/jim-smoke-evidence.md
      EVIDENCE_KIND: smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create synthetic non-sensitive evidence
        run: |
          printf '## Jim smoke evidence\n\nSynthetic PRIVATE-only publication test for public Issue #24. No API invoked.\n' > "$EVIDENCE_FILE"
      - name: Publish exclusively to mirrored private issue
        run: node .github/mjs/publish-jim-private.mjs
